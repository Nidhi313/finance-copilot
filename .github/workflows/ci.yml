name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://finance:finance@localhost:5432/finance
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t finance-api .
      - name: Container starts and answers health checks
        run: |
          docker run -d --name api -p 8000:8000 -e ENVIRONMENT=ci finance-api
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1

