name: Deploy

# Every merge to main: run CI, publish the API image, deploy to staging, then wait
# for a manual approval before the same image goes to production.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/finance-copilot-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/finance-copilot-api:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  staging:
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
    secrets: inherit

  production:
    needs: [image, staging]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
